# Builds the release archives. The version comes from the tag, and the binary
# gets its own version from plugin.json. The only thing set at link time is the
# release mark, so acta update can tell a release build from a source build.
version: 2

project_name: acta

builds:
  - id: acta
    main: ./cmd/acta
    binary: acta
    # A static binary runs on any machine, with no C library needed.
    env:
      - CGO_ENABLED=0
    # Marks the binary as a release build. go install and go build never set it.
    ldflags:
      - -X github.com/iyay/acta/internal/update.release=true
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: acta
    # No version in the name, so the latest/download links never change.
    name_template: "acta_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

# The installer looks for this exact file name.
checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # The installer is a release asset, so one fixed link fetches it.
  extra_files:
    - glob: scripts/install.sh
